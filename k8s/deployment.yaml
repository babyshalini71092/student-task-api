apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-task-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-task-api
  template:
    metadata:
      labels:
        app: student-task-api
    spec:
      containers:
        - name: student-task-api
          image: student-task-api:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080

          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 18

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5