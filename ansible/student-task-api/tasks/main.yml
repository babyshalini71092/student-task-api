---
- name: Install Java runtime
  apt:
    name: "{{ java_package }}"
    state: present
    update_cache: yes

- name: Create application directory
  file:
    path: "{{ app_directory }}"
    state: directory
    mode: '0755'

- name: Copy application JAR
  copy:
    src: "{{ jar_source }}"
    dest: "{{ jar_destination }}"
    mode: '0644'
  notify: Restart student task API

- name: Create systemd service
  template:
    src: student-task-api.service.j2
    dest: /etc/systemd/system/student-task-api.service
  notify:
    - Reload systemd
    - Restart student task API

- name: Enable and start application
  systemd:
    name: student-task-api
    enabled: yes
    state: started
    daemon_reload: yes
